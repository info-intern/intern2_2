<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2f7d78">
    <title>図書 一括貸出・返却</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>図書 一括貸出・返却</h1>
        </header>

        <main>
            <!-- ホーム画面 -->
            <section id="screen-home" class="screen">
                <p class="lead-text">処理する内容を選んでください</p>
                <div class="home-buttons">
                    <button id="home-lend-btn" type="button" class="primary-btn mode-btn">貸出</button>
                    <button id="home-return-btn" type="button" class="primary-btn mode-btn mode-btn-return">返却</button>
                    <button id="home-reserve-btn" type="button" class="primary-btn mode-btn mode-btn-reserve">予約</button>
                </div>
                <div class="home-secondary-buttons">
                    <button id="home-books-btn" type="button" class="list-btn">蔵書一覧を見る</button>
                    <button id="home-loans-btn" type="button" class="list-btn">貸出中の本を見る</button>
                    <button id="home-reservations-btn" type="button" class="list-btn">予約中の本を見る</button>
                </div>
            </section>

            <!-- スキャン画面 -->
            <section id="screen-scan" class="screen" hidden>
                <p id="scan-label" class="lead-text"></p>
                <p class="sub-text">本の背表紙のカメレオンコードを、まとめて連続で読み取れます。</p>
                <div class="scan-actions">
                    <button id="scan-start-btn" type="button" class="primary-btn">スキャンを開始する</button>
                    <button id="scan-cancel-btn" type="button" class="secondary-btn">ホームに戻る</button>
                </div>
            </section>

            <!-- 確認画面 -->
            <section id="screen-confirm" class="screen" hidden>
                <div class="confirm-header">
                    <h2 id="confirm-title"></h2>
                </div>
                <ul id="confirm-list" class="book-list"></ul>
                <div class="confirm-footer">
                    <p id="confirm-total" class="total-text"></p>
                    <button id="confirm-submit-btn" type="button" class="primary-btn"></button>
                    <button id="confirm-cancel-btn" type="button" class="secondary-btn">キャンセルしてホームに戻る</button>
                </div>
            </section>

            <!-- 完了画面 -->
            <section id="screen-complete" class="screen" hidden>
                <p id="complete-message" class="lead-text"></p>
                <ul id="complete-list" class="book-list book-list-plain"></ul>
                <div id="complete-notice" class="notice-box" hidden></div>
                <button id="complete-home-btn" type="button" class="primary-btn">ホームに戻る</button>
            </section>

            <!-- 蔵書一覧画面 -->
            <section id="screen-books" class="screen" hidden>
                <div class="confirm-header">
                    <h2 id="books-title"></h2>
                </div>
                <ul id="books-list" class="book-list"></ul>
                <button id="books-back-btn" type="button" class="secondary-btn">ホームに戻る</button>
            </section>

            <!-- 貸出中一覧画面 -->
            <section id="screen-loans" class="screen" hidden>
                <div class="confirm-header">
                    <h2 id="loans-title"></h2>
                </div>
                <ul id="loans-list" class="book-list"></ul>
                <p id="loans-empty" class="sub-text" hidden>現在貸出中の本はありません。</p>
                <button id="loans-back-btn" type="button" class="secondary-btn">ホームに戻る</button>
            </section>

            <!-- 予約中一覧画面 -->
            <section id="screen-reservations" class="screen" hidden>
                <div class="confirm-header">
                    <h2 id="reservations-title"></h2>
                </div>
                <ul id="reservations-list" class="book-list"></ul>
                <p id="reservations-empty" class="sub-text" hidden>現在予約中の本はありません。</p>
                <button id="reservations-back-btn" type="button" class="secondary-btn">ホームに戻る</button>
            </section>

            <!-- 予約: 本の選択画面 -->
            <section id="screen-reserve-select" class="screen" hidden>
                <div class="confirm-header">
                    <h2 id="reserve-select-title"></h2>
                </div>
                <p class="sub-text">予約したい本にチェックを付けてください。</p>
                <ul id="reserve-select-list" class="book-list"></ul>
                <div class="confirm-footer">
                    <p id="reserve-select-total" class="total-text"></p>
                    <button id="reserve-select-next-btn" type="button" class="primary-btn">次へ（予約日を指定）</button>
                    <button id="reserve-select-cancel-btn" type="button" class="secondary-btn">キャンセルしてホームに戻る</button>
                </div>
            </section>

            <!-- 予約: 予約日指定画面 -->
            <section id="screen-reserve-date" class="screen" hidden>
                <div class="confirm-header">
                    <h2 id="reserve-date-title"></h2>
                </div>
                <ul id="reserve-date-list" class="book-list book-list-plain"></ul>
                <div class="date-field">
                    <label for="reserve-date-input">予約期限日</label>
                    <input id="reserve-date-input" type="date">
                </div>
                <button id="reserve-date-submit-btn" type="button" class="primary-btn">予約を確定する</button>
                <button id="reserve-date-cancel-btn" type="button" class="secondary-btn">キャンセルしてホームに戻る</button>
            </section>

            <!-- 予約: 完了画面 -->
            <section id="screen-reserve-complete" class="screen" hidden>
                <p id="reserve-complete-message" class="lead-text"></p>
                <ul id="reserve-complete-list" class="book-list book-list-plain"></ul>
                <button id="reserve-complete-home-btn" type="button" class="primary-btn">ホームに戻る</button>
            </section>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/reader.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
